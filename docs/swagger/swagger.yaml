host: localhost:8080
info:
  contact: {}
  description: Threadlight social platform API
  title: Polaris API
  version: "0.1"
paths:
  /about:
    get:
      description: Returns public instance metadata such as instance name, description,
        version, admin contact, and links to policies
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AboutResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get instance about info
      tags:
      - about
  /achievements:
    get:
      description: Get a list of all available achievements
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Achievement'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all achievements
      tags:
      - achievements
  /achievements/unlock:
    post:
      consumes:
      - application/json
      description: Unlock or update progress on an achievement for the authenticated
        user
      parameters:
      - description: Achievement unlock request
        in: body
        name: unlock
        required: true
        schema:
          additionalProperties: true
          type: object
