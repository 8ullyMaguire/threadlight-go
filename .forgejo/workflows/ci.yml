name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run backend tests
        env:
          DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris_test?sslmode=disable
        run: |
          go mod download
          go test ./... -v -count=1 -timeout 120s

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./web
      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./web
      - name: Build frontend
        run: npm run build
        working-directory: ./web

  e2e-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris_e2e
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend
        env:
          DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris_e2e?sslmode=disable
        run: |
          go mod download
          go build -o bin/polaris ./cmd/polaris
      - name: Start backend
        env:
          DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris_e2e?sslmode=disable
          JWT_SECRET: test-secret
          LISTEN_ADDR: :8080
        run: |
          ./bin/polaris &
          sleep 3
      - name: Install frontend + Playwright
        run: |
          cd web
          npm ci
          npx playwright install --with-deps
      - name: Run E2E tests
        run: |
          cd web
          npm run test:e2e
        env:
          BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
